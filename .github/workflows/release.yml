name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish as a GitHub Release (e.g. v0.5.2)"
        required: true
        default: "v0.5.2"

permissions:
  contents: write

jobs:
  validate:
    name: Run Quality Gates
    uses: ./.github/workflows/validate.yml

  release:
    name: Create GitHub Release
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi

          # Extract release notes for this tag from CHANGELOG.md if present
          python3 -c '
          import sys, re
          tag = sys.argv[1]
          version = tag.lstrip("v")
          try:
              with open("CHANGELOG.md") as f:
                  lines = f.read().splitlines()
          except FileNotFoundError:
              sys.exit(0)
          in_version = False
          version_lines = []
          for line in lines:
              header_match = re.match(r"^##\s+\[?v?([0-9]+\.[0-9]+\.[0-9]+[^\]\s]*)\]?", line)
              if header_match:
                  if header_match.group(1) == version:
                      in_version = True
                      continue
                  elif in_version:
                      break
              elif in_version:
                  if re.match(r"^\[[^\]]+\]:\s*http", line):
                      break
                  version_lines.append(line)
          extracted = "\n".join(version_lines).strip()
          if extracted:
              with open("RELEASE_NOTES.md", "w") as out:
                  out.write(extracted + "\n")
          ' "$TAG"

          if [ -s "RELEASE_NOTES.md" ]; then
            gh release create "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
