name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to promote to public GitHub Release (e.g. v0.7.0)"
        required: true
        default: "v0.7.0"
      promote:
        description: "Promote to public release (true = publish publicly, false = draft only)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  validate:
    name: Run Quality Gates
    uses: ./.github/workflows/validate.yml

  release:
    name: Publish or Prepare Release
    needs: [validate]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Create or Promote GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          IS_DISPATCH="${{ github.event_name == 'workflow_dispatch' }}"
          SHOULD_PROMOTE="${{ github.event.inputs.promote || 'false' }}"

          # Extract release notes for this tag from CHANGELOG.md if present
          python3 -c '
          import sys, re
          tag = sys.argv[1]
          version = tag.lstrip("v")
          try:
              with open("CHANGELOG.md") as f:
                  lines = f.read().splitlines()
          except FileNotFoundError:
              sys.exit(0)
          in_version = False
          version_lines = []
          for line in lines:
              header_match = re.match(r"^##\s+\[?v?([0-9]+\.[0-9]+\.[0-9]+[^\]\s]*)\]?", line)
              if header_match:
                  if header_match.group(1) == version:
                      in_version = True
                      continue
                  elif in_version:
                      break
              elif in_version:
                  if re.match(r"^\[[^\]]+\]:\s*http", line):
                      break
                  version_lines.append(line)
          extracted = "\n".join(version_lines).strip()
          if extracted:
              with open("RELEASE_NOTES.md", "w") as out:
                  out.write(extracted + "\n")
          ' "$TAG"

          NOTES_ARG="--generate-notes"
          if [ -s "RELEASE_NOTES.md" ]; then
            NOTES_ARG="--notes-file RELEASE_NOTES.md"
          fi

          # Check if a release for this tag already exists
          EXISTS=false
          if gh release view "$TAG" >/dev/null 2>&1; then
            EXISTS=true
          fi

          if [ "$IS_DISPATCH" = "true" ] && [ "$SHOULD_PROMOTE" = "true" ]; then
            echo "🚀 Promoting $TAG to full public release after manual approval..."
            if [ "$EXISTS" = "true" ]; then
              gh release edit "$TAG" --draft=false $NOTES_ARG
            else
              gh release create "$TAG" --title "$TAG" --draft=false $NOTES_ARG
            fi
            echo "✅ Release $TAG is now publicly published!"
          else
            echo "📝 Preparing draft release for $TAG (awaiting manual testing & promotion)..."
            if [ "$EXISTS" = "true" ]; then
              gh release edit "$TAG" --draft=true $NOTES_ARG
            else
              gh release create "$TAG" --title "$TAG" --draft=true $NOTES_ARG
            fi
            echo "📌 Draft release created for $TAG. Test it, then promote it to release!"
          fi
