name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to promote to public GitHub Release (e.g. v0.8.0)"
        required: true
        default: "v0.8.0"
      promote:
        description: "Promote to public release (true = publish publicly, false = draft only)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  validate:
    name: Run Quality Gates
    uses: ./.github/workflows/validate.yml

  release:
    name: Publish or Prepare Release
    needs: [validate]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Build HACS Release Zip (vacuula.zip)
        run: |
          cd "${{ github.workspace }}/custom_components/vacuula"
          zip -r "${{ github.workspace }}/vacuula.zip" ./ -x "*/__pycache__/*" "*.pyc"

      - name: Create or Promote GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          IS_DISPATCH="${{ github.event_name == 'workflow_dispatch' }}"
          SHOULD_PROMOTE="${{ github.event.inputs.promote || 'false' }}"

          # Extract release notes for this tag from CHANGELOG.md if present
          python3 -c '
          import sys, re
          tag = sys.argv[1]
          version = tag.lstrip("v")
          try:
              with open("CHANGELOG.md") as f:
                  lines = f.read().splitlines()
          except FileNotFoundError:
              sys.exit(0)
          in_version = False
          version_lines = []
          for line in lines:
              header_match = re.match(r"^##\s+\[?v?([0-9]+\.[0-9]+\.[0-9]+[^\]\s]*)\]?", line)
              if header_match:
                  if header_match.group(1) == version:
                      in_version = True
                      continue
                  elif in_version:
                      break
              elif in_version:
                  if re.match(r"^\[[^\]]+\]:\s*http", line):
                      break
                  version_lines.append(line)
          extracted = "\n".join(version_lines).strip()
          if extracted:
              with open("RELEASE_NOTES.md", "w") as out:
                  out.write(extracted + "\n")
          ' "$TAG"

          # Always fetch auto-generated notes from GitHub API
          AUTO_NOTES=$(gh api --method POST "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$TAG" -q .body 2>/dev/null || true)

          if [ -s "RELEASE_NOTES.md" ]; then
            # Extract auto-generated contributors / changelog link to append to curated notes
            if [ -n "$AUTO_NOTES" ]; then
              python3 -c '
              import sys, re
              auto = sys.stdin.read()
              if not auto.strip():
                  sys.exit(0)
              match_new = re.search(r"(## (?:New )?Contributors.*)", auto, re.DOTALL)
              if match_new:
                  section = match_new.group(1).strip()
                  with open("RELEASE_NOTES.md", "a") as f:
                      f.write("\n\n" + section + "\n")
              else:
                  contributors = sorted(set(re.findall(r"@([a-zA-Z0-9_-]+)", auto)))
                  if contributors:
                      contributor_lines = [f"* @{c}" for c in contributors]
                      with open("RELEASE_NOTES.md", "a") as f:
                          f.write("\n\n## Contributors\n" + "\n".join(contributor_lines) + "\n")
                  match_changelog = re.search(r"(\*\*Full Changelog\*\*:.*)", auto)
                  if match_changelog:
                      with open("RELEASE_NOTES.md", "a") as f:
                          f.write("\n" + match_changelog.group(1).strip() + "\n")
              ' <<< "$AUTO_NOTES"
            fi
          elif [ -n "$AUTO_NOTES" ]; then
            printf "%s\n" "$AUTO_NOTES" > RELEASE_NOTES.md
          fi

          NOTES_ARG=""
          if [ -s "RELEASE_NOTES.md" ]; then
            NOTES_ARG="--notes-file RELEASE_NOTES.md"
          else
            NOTES_ARG="--generate-notes"
          fi

          # Check if a release for this tag already exists
          EXISTS=false
          if gh release view "$TAG" >/dev/null 2>&1; then
            EXISTS=true
          fi

          if [ "$IS_DISPATCH" = "true" ] && [ "$SHOULD_PROMOTE" = "true" ]; then
            echo "🚀 Promoting $TAG to full public release after manual approval..."
            if [ "$EXISTS" = "true" ]; then
              gh release upload "$TAG" vacuula.zip --clobber
              if [ -s "RELEASE_NOTES.md" ]; then
                gh release edit "$TAG" --draft=false --notes-file RELEASE_NOTES.md
              else
                gh release edit "$TAG" --draft=false
              fi
            else
              gh release create "$TAG" vacuula.zip --title "$TAG" --draft=false $NOTES_ARG
            fi
            echo "✅ Release $TAG is now publicly published!"
          else
            echo "📝 Preparing draft release for $TAG (awaiting manual testing & promotion)..."
            if [ "$EXISTS" = "true" ]; then
              gh release upload "$TAG" vacuula.zip --clobber
              if [ -s "RELEASE_NOTES.md" ]; then
                gh release edit "$TAG" --draft=true --notes-file RELEASE_NOTES.md
              else
                gh release edit "$TAG" --draft=true
              fi
            else
              gh release create "$TAG" vacuula.zip --title "$TAG" --draft=true $NOTES_ARG
            fi
            echo "📌 Draft release created for $TAG. Test it, then promote it to release!"
          fi
