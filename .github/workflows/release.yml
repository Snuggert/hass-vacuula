name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to promote to public GitHub Release (e.g. v0.8.0)"
        required: true
        default: "v0.8.0"
      promote:
        description: "Promote to public release (true = publish publicly, false = draft only)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  validate:
    name: Run Quality Gates
    uses: ./.github/workflows/validate.yml

  release:
    name: Publish or Prepare Release
    needs: [validate]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Build HACS Release Zip (vacuula.zip)
        run: |
          cd "${{ github.workspace }}/custom_components/vacuula"
          zip -r "${{ github.workspace }}/vacuula.zip" ./ -x "*/__pycache__/*" "*.pyc"

      - name: Create or Promote GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          IS_DISPATCH="${{ github.event_name == 'workflow_dispatch' }}"
          SHOULD_PROMOTE="${{ github.event.inputs.promote || 'false' }}"

          # Extract notes from CHANGELOG.md and append contributors from GitHub generate-notes API
          AUTO_NOTES=$(gh api --method POST "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$TAG" -q .body 2>/dev/null || true)
          python3 devtools/release_notes.py "$TAG" <<< "$AUTO_NOTES"

          NOTES_ARG=""
          if [ -s "RELEASE_NOTES.md" ]; then
            NOTES_ARG="--notes-file RELEASE_NOTES.md"
          else
            NOTES_ARG="--generate-notes"
          fi

          # Check if a release for this tag already exists and inspect its draft status
          EXISTS=false
          IS_DRAFT=true
          if RELEASE_DRAFT_STATUS=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null); then
            EXISTS=true
            if [ "$RELEASE_DRAFT_STATUS" = "false" ]; then
              IS_DRAFT=false
            fi
          fi

          if [ "$IS_DISPATCH" = "true" ] && [ "$SHOULD_PROMOTE" = "true" ]; then
            echo "🚀 Promoting $TAG to full public release after manual approval..."
            if [ "$EXISTS" = "true" ]; then
              gh release upload "$TAG" vacuula.zip --clobber
              if [ -s "RELEASE_NOTES.md" ]; then
                gh release edit "$TAG" --draft=false --notes-file RELEASE_NOTES.md
              else
                gh release edit "$TAG" --draft=false
              fi
            else
              gh release create "$TAG" vacuula.zip --title "$TAG" --draft=false $NOTES_ARG
            fi
            echo "✅ Release $TAG is now publicly published!"
          elif [ "$EXISTS" = "true" ] && [ "$IS_DRAFT" = "false" ]; then
            echo "🛡️ Release $TAG is ALREADY PUBLICLY PUBLISHED. Preserving public production status (never demoting to draft)."
            gh release upload "$TAG" vacuula.zip --clobber
            if [ -s "RELEASE_NOTES.md" ]; then
              gh release edit "$TAG" --draft=false --notes-file RELEASE_NOTES.md
            fi
            echo "✅ Public release $TAG assets and notes updated successfully!"
          else
            echo "📝 Preparing draft release for $TAG (awaiting manual testing & promotion)..."
            if [ "$EXISTS" = "true" ]; then
              gh release upload "$TAG" vacuula.zip --clobber
              if [ -s "RELEASE_NOTES.md" ]; then
                gh release edit "$TAG" --draft=true --notes-file RELEASE_NOTES.md
              else
                gh release edit "$TAG" --draft=true
              fi
            else
              gh release create "$TAG" vacuula.zip --title "$TAG" --draft=true $NOTES_ARG
            fi
            echo "📌 Draft release created for $TAG. Test it, then promote it to release!"
          fi
