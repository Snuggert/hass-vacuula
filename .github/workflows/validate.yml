name: Validate

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Ruff check
        uses: astral-sh/ruff-action@v3
        with:
          args: "check ."

      - name: Run Ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check ."

  typecheck:
    name: Type Checking (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
          activate-environment: true

      - name: Install dependencies
        run: uv pip install -r requirements_test.txt

      - name: Run Mypy
        run: mypy custom_components/vacuula

  frontend:
    name: Frontend Quality & Tests (Biome, TypeScript, Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Biome Lint & Format Check
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npm run typecheck

      - name: Run Vitest Frontend Tests
        run: npm test

  hassfest:
    name: Hassfest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run HACS Action
        uses: hacs/action@main
        with:
          category: integration

  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Install dependencies
        run: uv pip install -r requirements_test.txt

      - name: Run Pytest with Coverage
        shell: bash
        run: |
          set -o pipefail
          pytest tests/ -n auto --cov=custom_components.vacuula --cov-report=term-missing -v --tb=short 2>&1 | tee pytest.log
          PYTEST_STATUS=${PIPESTATUS[0]}
          if [ $PYTEST_STATUS -ne 0 ]; then
            echo "### ❌ Pytest Failed (Python ${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat pytest.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $PYTEST_STATUS
          fi
