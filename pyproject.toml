[project]
name = "hass-vacuula"
version = "0.8.0"
description = "Home Assistant integration for local Vacuula servers and Neato Botvac robots"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Snuggert" }]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = [".git", ".cache", ".venv"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.vacuula", "devtools"]

[tool.mypy]
python_version = "3.14"
explicit_package_bases = true
check_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
disable_error_code = ["arg-type"]

