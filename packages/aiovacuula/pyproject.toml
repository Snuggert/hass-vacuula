[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiovacuula"
version = "0.7.1"
description = "Standalone async Python SDK and domain core for Vacuula servers (Zero Home Assistant dependencies)"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Snuggert" }]
dependencies = [
    "aiohttp>=3.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiovacuula"]
