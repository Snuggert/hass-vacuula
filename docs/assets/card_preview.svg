<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 660" width="500" height="660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Outer Card Frame -->
  <rect x="0" y="0" width="500" height="660" rx="14" fill="#1c202a" stroke="#2c3444" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(18, 16)">
    <div xmlns="http://www.w3.org/1999/xhtml"></div>
    <!-- Title row: Robot Name + Status Badge -->
    <text x="0" y="20" fill="#f8fafc" font-size="17" font-weight="600">Mappa</text>
    <rect x="68" y="7" width="58" height="18" rx="9" fill="rgba(34, 197, 94, 0.2)"/>
    <text x="97" y="20" fill="#4ade80" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.3">DOCKED</text>

    <!-- Subtitle -->
    <text x="0" y="38" fill="#94a3b8" font-size="12">Living Room • Clean</text>

    <!-- Header Telemetry Pills -->
    <g transform="translate(268, 6)">
      <rect x="0" y="0" width="102" height="26" rx="13" fill="rgba(34, 197, 94, 0.2)"/>
      <text x="51" y="17" fill="#4ade80" font-size="11.5" font-weight="600" text-anchor="middle">Schedule On</text>

      <rect x="110" y="0" width="86" height="26" rx="13" fill="rgba(148, 163, 184, 0.14)"/>
      <text x="153" y="17" fill="#e2e8f0" font-size="11.5" font-weight="600" text-anchor="middle">96%</text>
    </g>
  </g>

  <!-- Map Wrapper -->
  <g transform="translate(14, 70)">
    <rect x="0" y="0" width="472" height="340" rx="10" fill="#141822" stroke="#252c3c" stroke-width="1"/>

    <!-- Map Toolbar (Floor Plan, Last Run, Refresh) -->
    <g transform="translate(12, 12)">
      <rect x="0" y="0" width="168" height="28" rx="7" fill="rgba(15, 23, 42, 0.9)" stroke="#263042" stroke-width="1"/>
      <rect x="2" y="2" width="80" height="24" rx="5" fill="#38bdf8"/>
      <text x="42" y="18" fill="#0f172a" font-size="11.5" font-weight="600" text-anchor="middle">Floor Plan</text>
      <text x="124" y="18" fill="#cbd5e1" font-size="11.5" font-weight="500" text-anchor="middle">Last Run</text>
    </g>

    <g transform="translate(432, 12)">
      <rect x="0" y="0" width="28" height="28" rx="7" fill="rgba(15, 23, 42, 0.9)" stroke="#263042" stroke-width="1"/>
      <text x="14" y="18" fill="#cbd5e1" font-size="13" text-anchor="middle">↻</text>
    </g>

    <!-- Floorplan Rooms -->
    <g transform="translate(80, 26)">
      <!-- Diningroom (Coral, Selected) -->
      <polygon points="65,22 195,22 195,148 65,148" fill="#e47251" fill-opacity="0.32" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="12 5"/>
      <!-- Livingroom (Blue) -->
      <polygon points="195,20 325,20 325,136 195,136" fill="#5aa9ff" fill-opacity="0.22" stroke="#5aa9ff" stroke-width="1.5"/>
      <!-- Hallway (Lime Green) -->
      <polygon points="65,148 198,148 198,256 155,256 155,226 105,226 105,182 65,182" fill="#9cd34a" fill-opacity="0.22" stroke="#9cd34a" stroke-width="1.5"/>
      <!-- Bedroom (Amber) -->
      <polygon points="65,182 105,182 105,275 18,275 18,200 65,200" fill="#e5a93c" fill-opacity="0.22" stroke="#e5a93c" stroke-width="1.5"/>
      <!-- Office (Mint/Teal, Selected) -->
      <polygon points="198,226 308,228 308,284 198,284" fill="#3cd298" fill-opacity="0.32" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="12 5"/>

      <!-- Dock Marker in Hallway -->
      <circle cx="112" cy="188" r="5" fill="#22c55e" stroke="#ffffff" stroke-width="1.5"/>

      <!-- Room Pin Badges -->
      <!-- Diningroom Pin (Selected) -->
      <g transform="translate(130, 85)">
        <rect x="-44" y="-12" width="88" height="24" rx="12" fill="#0284c7" stroke="#ffffff" stroke-width="1"/>
        <text x="0" y="4.5" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Diningroom</text>
      </g>

      <!-- Livingroom Pin -->
      <g transform="translate(260, 78)">
        <rect x="-42" y="-11" width="84" height="22" rx="11" fill="#0f172a" stroke="rgba(255,255,255,0.35)" stroke-width="0.8"/>
        <circle cx="-28" cy="0" r="3.5" fill="#5aa9ff"/>
        <text x="6" y="3.5" fill="#f8fafc" font-size="10.5" font-weight="600" text-anchor="middle">Livingroom</text>
      </g>

      <!-- Hallway Pin -->
      <g transform="translate(148, 194)">
        <rect x="-35" y="-11" width="70" height="22" rx="11" fill="#0f172a" stroke="rgba(255,255,255,0.35)" stroke-width="0.8"/>
        <circle cx="-23" cy="0" r="3.5" fill="#9cd34a"/>
        <text x="5" y="3.5" fill="#f8fafc" font-size="10.5" font-weight="600" text-anchor="middle">Hallway</text>
      </g>

      <!-- Bedroom Pin -->
      <g transform="translate(60, 238)">
        <rect x="-36" y="-11" width="72" height="22" rx="11" fill="#0f172a" stroke="rgba(255,255,255,0.35)" stroke-width="0.8"/>
        <circle cx="-24" cy="0" r="3.5" fill="#e5a93c"/>
        <text x="5" y="3.5" fill="#f8fafc" font-size="10.5" font-weight="600" text-anchor="middle">Bedroom</text>
      </g>

      <!-- Office Pin (Selected) -->
      <g transform="translate(253, 255)">
        <rect x="-32" y="-12" width="64" height="24" rx="12" fill="#0284c7" stroke="#ffffff" stroke-width="1"/>
        <text x="0" y="4.5" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Office</text>
      </g>
    </g>
  </g>

  <!-- Zones Bar (Chips) -->
  <g transform="translate(14, 422)">
    <!-- All Zones -->
    <rect x="0" y="0" width="70" height="26" rx="13" fill="rgba(148, 163, 184, 0.08)" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1"/>
    <text x="35" y="17" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="middle">All Zones</text>

    <!-- Bedroom -->
    <rect x="76" y="0" width="76" height="26" rx="13" fill="rgba(148, 163, 184, 0.08)" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1"/>
    <circle cx="90" cy="13" r="3.5" fill="#e5a93c"/>
    <text x="119" y="17" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="middle">Bedroom</text>

    <!-- Diningroom (Selected) -->
    <rect x="158" y="0" width="94" height="26" rx="13" fill="rgba(56, 189, 248, 0.22)" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="172" cy="13" r="3.5" fill="#e47251"/>
    <text x="210" y="17" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">Diningroom</text>

    <!-- Hallway -->
    <rect x="258" y="0" width="72" height="26" rx="13" fill="rgba(148, 163, 184, 0.08)" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1"/>
    <circle cx="272" cy="13" r="3.5" fill="#9cd34a"/>
    <text x="299" y="17" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="middle">Hallway</text>

    <!-- Livingroom -->
    <rect x="336" y="0" width="82" height="26" rx="13" fill="rgba(148, 163, 184, 0.08)" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1"/>
    <circle cx="350" cy="13" r="3.5" fill="#5aa9ff"/>
    <text x="382" y="17" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="middle">Livingroom</text>

    <!-- Office (Selected) -->
    <rect x="424" y="0" width="48" height="26" rx="13" fill="rgba(56, 189, 248, 0.22)" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="437" cy="13" r="3.5" fill="#3cd298"/>
    <text x="454" y="17" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">Office</text>
  </g>

  <!-- Controls Section -->
  <g transform="translate(14, 460)">
    <!-- Action Row (2fr repeat(4, 1fr)) -->
    <!-- Total width 472: 2fr = 152, each 1fr = 74, gap = 6 -->
    <!-- Clean 2 Zones (Primary) -->
    <rect x="0" y="0" width="144" height="38" rx="10" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
    <text x="72" y="24" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Clean 2 Zones</text>

    <!-- Pause -->
    <rect x="152" y="0" width="74" height="38" rx="10" fill="rgba(148, 163, 184, 0.1)" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1"/>
    <text x="189" y="24" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">Pause</text>

    <!-- Stop -->
    <rect x="232" y="0" width="74" height="38" rx="10" fill="rgba(148, 163, 184, 0.1)" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1"/>
    <text x="269" y="24" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">Stop</text>

    <!-- Dock -->
    <rect x="312" y="0" width="74" height="38" rx="10" fill="rgba(148, 163, 184, 0.1)" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1"/>
    <text x="349" y="24" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">Dock</text>

    <!-- Locate -->
    <rect x="392" y="0" width="80" height="38" rx="10" fill="rgba(148, 163, 184, 0.1)" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1"/>
    <text x="432" y="24" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">Locate</text>
  </g>

  <!-- Modes Row (Fan Speed & Navigation Mode) -->
  <g transform="translate(14, 510)">
    <!-- Fan Speed Mode Group -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="112" height="28" rx="9" fill="rgba(148, 163, 184, 0.1)"/>
      <text x="28" y="18" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">Eco</text>
      <rect x="56" y="2" width="52" height="24" rx="6" fill="rgba(56, 189, 248, 0.24)"/>
      <text x="82" y="18" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">Turbo</text>
    </g>

    <!-- Navigation Mode Group -->
    <g transform="translate(254, 0)">
      <rect x="0" y="0" width="218" height="28" rx="9" fill="rgba(148, 163, 184, 0.1)"/>
      <rect x="2" y="2" width="62" height="24" rx="6" fill="rgba(56, 189, 248, 0.24)"/>
      <text x="33" y="18" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">Normal</text>
      <text x="108" y="18" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">Extra Care</text>
      <text x="183" y="18" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">Deep</text>
    </g>
  </g>

  <!-- Footer Telemetry Strip -->
  <g transform="translate(14, 552)">
    <rect x="0" y="0" width="472" height="34" rx="8" fill="rgba(148, 163, 184, 0.06)" stroke="rgba(148, 163, 184, 0.14)" stroke-width="1"/>
    <text x="16" y="21" fill="#94a3b8" font-size="11">Last clean: <tspan fill="#f1f5f9" font-weight="600">42.8 m²</tspan></text>
    <text x="178" y="21" fill="#94a3b8" font-size="11">Duration: <tspan fill="#f1f5f9" font-weight="600">51 min</tspan></text>
    <text x="335" y="21" fill="#94a3b8" font-size="11">Total runs: <tspan fill="#f1f5f9" font-weight="600">154</tspan></text>
  </g>
</svg>
